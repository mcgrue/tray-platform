<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17252a">
  <title>Attention · Tray Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/index.css">
  <script src="/index.js" defer></script>
</head>
<body>
  <header class="web-header">
    <span>TRAY PLATFORM</span>
    <div class="header-actions">
      <span id="connection" class="connection-indicator" data-connected="false" role="status" title="Connecting to your desktop…"><span class="visually-hidden">Connecting to your desktop…</span></span>
      <div class="web-menu">
        <button id="menu-toggle" type="button" aria-label="More options" aria-expanded="false" aria-controls="header-menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div id="header-menu" hidden>
          <button id="refresh" type="button">Refresh</button>
          <button id="open-notifications" type="button">Phone notifications</button>
        </div>
      </div>
    </div>
  </header>
  <section id="delivery" hidden aria-label="Unconfirmed delivery">
    <p>A previous send is unconfirmed. Check delivery before sending again.</p>
    <button id="check-delivery" type="button">Check delivery</button>
    <button id="reset-delivery" type="button">I checked Codex; allow another send</button>
    <p id="delivery-status" role="status"></p>
  </section>
  <fieldset id="online-controls" disabled>
    <main></main>
  </fieldset>
  <dialog id="notifications-dialog" aria-labelledby="notifications-title">
    <header class="notifications-header"><h2 id="notifications-title">Phone notifications</h2><button id="close-notifications" type="button" aria-label="Close phone notifications">Close</button></header>
    <fieldset id="notification-controls" disabled>
      <p>Get notified when attention is needed, even with this app closed.</p>
      <button id="enable-push" type="button">Enable notifications</button>
      <button id="test-push" type="button" hidden>Send test notification</button>
      <button id="disable-push" type="button" hidden>Disable on this phone</button>
      <p id="push-status" role="status"></p>
    </fieldset>
    <p id="notification-offline" hidden>Reconnect to your desktop to change notifications.</p>
  </dialog>
  <noscript>Enable JavaScript to use the attention pane.</noscript>
</body>
</html>
